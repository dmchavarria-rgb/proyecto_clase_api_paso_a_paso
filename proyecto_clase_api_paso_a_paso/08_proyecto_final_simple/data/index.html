<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Paso 8 - Proyecto final simple</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Paso 8: proyecto final simple</h1>
    <p>Integra JSON local, API externa e interacción con botones.</p>

    <section class="card">
      <h2>Imagen automática</h2>
      <p id="estadoImagen">Cargando imagen...</p>
      <img id="imagenPerro" src="" alt="Imagen de perro">
      <button id="btnOtraImagen">Otra imagen</button>
    </section>

    <section class="card">
      <h2>Promedio de Luis Mora</h2>
      <button id="btnPromedio">Calcular promedio</button>
      <div id="resultadoPromedio">Aquí aparecerá el promedio.</div>
    </section>

    <section class="card">
      <h2>Curiosidad desde API</h2>
      <button id="btnDato">Cargar dato</button>
      <div id="resultadoDato">Aquí aparecerá una curiosidad.</div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
