<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Paso 6 - Imagen automática</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Paso 6: cargar una imagen automáticamente</h1>
    <p>La imagen aparece sin presionar botón porque se carga al iniciar la página.</p>
    <div class="card">
      <p id="estado">Cargando imagen...</p>
      <img id="imagenPerro" src="" alt="Imagen aleatoria de perro">
    </div>
    <button id="btnRecargar">Cargar otra imagen</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
