<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte 10 - Eventos, DOM y JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

  <main class="container py-4">
    <section class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4">Parte 10: Eventos + DOM + JSON embebido</h1>
        <p class="text-muted">
          En esta parte los eventos se usan para mostrar, buscar, filtrar y calcular datos.
        </p>

        <div class="row g-3">
          <div class="col-md-4">
            <button id="btnMostrar" class="btn btn-primary w-100">Mostrar estudiantes</button>
          </div>
          <div class="col-md-4">
            <button id="btnPromedios" class="btn btn-success w-100">Calcular promedios</button>
          </div>
          <div class="col-md-4">
            <button id="btnLimpiar" class="btn btn-outline-secondary w-100">Limpiar tabla</button>
          </div>
        </div>

        <hr>

        <div class="row g-3">
          <div class="col-md-6">
            <label for="buscador" class="form-label">Buscar por nombre</label>
            <input id="buscador" type="text" class="form-control" placeholder="Escriba Ana, Luis, María...">
          </div>
          <div class="col-md-6">
            <label for="filtroCarrera" class="form-label">Filtrar por carrera</label>
            <select id="filtroCarrera" class="form-select">
              <option value="">Todas</option>
              <option value="Tecnologías de la Información">Tecnologías de la Información</option>
              <option value="Software">Software</option>
              <option value="Sistemas">Sistemas</option>
            </select>
          </div>
        </div>

        <hr>

        <h2 class="h5">Agregar estudiante con submit</h2>
        <form id="formEstudiante" class="row g-2">
          <div class="col-md-4">
            <input id="nuevoNombre" type="text" class="form-control" placeholder="Nombre">
          </div>
          <div class="col-md-4">
            <select id="nuevaCarrera" class="form-select">
              <option value="">Carrera...</option>
              <option value="Tecnologías de la Información">Tecnologías de la Información</option>
              <option value="Software">Software</option>
              <option value="Sistemas">Sistemas</option>
            </select>
          </div>
          <div class="col-md-2">
            <input id="nuevaNota" type="number" class="form-control" placeholder="Nota" min="0" max="20">
          </div>
          <div class="col-md-2">
            <button class="btn btn-warning w-100" type="submit">Agregar</button>
          </div>
        </form>

        <div id="mensaje" class="alert alert-info mt-3">
          Presione un botón para iniciar.
        </div>

        <div class="table-responsive">
          <table class="table table-striped table-bordered mt-3">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Carrera</th>
                <th>Notas</th>
                <th>Promedio</th>
              </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
