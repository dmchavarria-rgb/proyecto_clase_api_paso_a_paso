<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte 12 - Productos desde DummyJSON</title>

  <!-- Bootstrap se usa solo para que las tarjetas se vean bien sin escribir demasiado CSS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Estilos propios del ejemplo. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-4">
    <section class="text-center mb-4">
      <h1 class="h3">Parte 12: Productos desde una API</h1>
      <p class="text-muted">
        En esta práctica se consume la API de DummyJSON y se recorren los productos para construir tarjetas visuales.
      </p>
    </section>

    <section class="card shadow-sm mb-4">
      <div class="card-body d-flex flex-column flex-md-row gap-3 justify-content-between align-items-md-center">
        <div>
          <h2 class="h5 mb-1">Catálogo de productos</h2>
          <p class="mb-0 text-muted" id="estadoCarga">Presione el botón para cargar productos.</p>
        </div>

        <button id="btnCargarProductos" class="btn btn-primary">
          Cargar productos
        </button>
      </div>
    </section>

    <!-- Aquí JavaScript va a insertar las tarjetas de productos. -->
    <section id="contenedorProductos" class="row g-4"></section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
